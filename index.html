<title>Aileen 的像素世界</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+SC:wght@500;700&family=Press+Start+2P&display=swap">
<style>
/* Layout: one 16:9 pixel stage; HUD floats on top, dialogue and menu dock to the bottom. Narrow screens stack them. */
:root{
  --bg:#0d0b14; --ink:#0b0911; --panel:#2a2a3c; --panel-hi:#3b3b54;
  --edge:#d4d1e0; --edge-lo:#6a6885; --txt:#f4f0e6; --dim:#a9a6bd;
  --gold:#ffd86b; --rose:#ff6b8a; --sel:#f6e27a;
  --px:'DotGothic16','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  --px8:'Press Start 2P','DotGothic16',monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--txt);font-family:var(--px);margin:0;
  padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font-family:inherit;color:inherit}
#wrap{max-width:1280px;margin:0 auto;container-type:inline-size}
#game{position:relative;font-size:max(calc(100cqw / 48),10px);line-height:1.25;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;outline:none}
.view{position:relative;aspect-ratio:16/9;background:#000;overflow:hidden;border-radius:.5em;
  box-shadow:0 0 0 .2em #2a2840,0 1em 3em rgba(0,0,0,.6)}
.stage{position:absolute;inset:0}
#cv{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer;background:#000}
.crt .stage::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:3;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px),
  radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.45) 100%)}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .35s;z-index:20}
#fade.on{opacity:1}

.pnl{background:var(--panel);border:.22em solid var(--edge);border-radius:.35em;
  box-shadow:inset 0 0 0 .14em var(--edge-lo),0 .15em 0 .2em var(--ink)}

/* HUD */
#hud{position:absolute;inset:0 0 auto 0;display:flex;justify-content:space-between;align-items:flex-start;
  padding:.6em;gap:.6em;pointer-events:none;z-index:6}
#hud>*{pointer-events:auto}
.card{display:flex;gap:.7em;padding:.5em .8em .5em .5em;min-width:12em;align-items:center}
#pcard{width:4.4em;height:4.4em;image-rendering:pixelated;background:#3a3a56;border:.15em solid var(--edge-lo);flex:none}
.card .nm{font-family:var(--px8);font-size:.8em;letter-spacing:.04em}
.card .lv{font-family:var(--px8);font-size:.6em;color:var(--dim);margin-top:.5em}
.hearts{display:flex;gap:.2em;margin-top:.55em}
.hearts img{width:1.25em;height:1.1em;image-rendering:pixelated}
.xp{height:.4em;background:#15141f;border:.1em solid var(--edge-lo);margin-top:.5em;width:9em}
.xp i{display:block;height:100%;background:var(--gold);width:0;transition:width .4s}

#strip{display:flex;gap:1.6em;align-items:flex-end;margin-top:.1em}
.isl{background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.3em;
  transition:transform .15s;padding:0}
.isl:hover,.isl:focus-visible{transform:translateY(-.2em)}
.isl canvas{width:5.6em;height:3.6em;image-rendering:pixelated;border:.18em solid #3c5a3a;
  border-bottom:.55em solid #5a3d28;border-radius:.5em .5em 45% 45%/.5em .5em 1.2em 1.2em;background:#7fb860}
.isl span{background:rgba(20,20,34,.9);border:.12em solid var(--edge-lo);padding:.15em .5em;font-size:.62em;
  text-align:center;line-height:1.15}
.isl[aria-current="true"] canvas{border-color:var(--gold);box-shadow:0 0 0 .14em #000,0 0 1em rgba(255,216,107,.65)}
.isl[aria-current="true"] span{border-color:var(--gold);color:var(--gold)}
#explore{font-size:.8em;padding:.55em 1em;cursor:pointer;display:flex;gap:.5em;align-items:center;white-space:nowrap}
#explore:hover{background:var(--panel-hi)}
#explore b{color:var(--gold);font-weight:400}

/* Hub triptych */
#hub{position:absolute;left:0;right:0;top:7.4em;bottom:8.4em;display:grid;grid-template-columns:1fr 1.18fr 1fr;
  gap:.5em;padding:0 .4em;z-index:2}
.pan{position:relative;padding:0;border:.25em solid var(--edge);border-radius:.4em;overflow:hidden;background:#000;
  cursor:pointer;box-shadow:0 0 0 .16em var(--ink);transition:transform .15s,border-color .15s}
.pan canvas{width:100%;height:100%;display:block;image-rendering:pixelated;object-fit:cover}
.pan:hover,.pan.sel{border-color:var(--gold);transform:translateY(-.15em)}
.pan .lab{position:absolute;top:.5em;left:.5em;background:rgba(18,18,30,.92);border:.14em solid var(--edge-lo);
  padding:.25em .6em;font-size:.78em;text-align:left;line-height:1.2}
.pan .lab small{display:block;font-size:.7em;color:var(--dim)}

/* Bottom dock */
#bottom{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:flex-end;gap:.6em;padding:.6em;
  pointer-events:none;z-index:7}
#bottom>*{pointer-events:auto}
#dlg{flex:1 1 54%;display:flex;gap:.9em;padding:.7em .9em;min-height:6.6em;cursor:pointer;position:relative;max-width:44em}
#por{width:6em;height:5em;image-rendering:pixelated;background:#3a3a56;border-radius:.2em;flex:none;
  border:.14em solid var(--edge-lo)}
#dlg .bar{width:.14em;background:var(--edge-lo);flex:none}
#who{font-size:.95em;margin-bottom:.3em;color:var(--gold)}
#tx{font-size:.8em;line-height:1.5;min-height:3em}
#more{position:absolute;right:.9em;bottom:.5em;font-size:.8em;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
#menu{flex:0 0 31%;display:flex;flex-direction:column;gap:.3em;padding:.45em}
#menu button{background:#232334;border:.14em solid var(--edge-lo);color:var(--txt);text-align:left;cursor:pointer;
  padding:.5em .7em;font-size:.76em;line-height:1.2}
#menu button small{display:block;color:var(--dim);font-size:.75em}
#menu button.on,#menu button:hover{border-color:var(--sel);color:var(--sel);background:#2e2e44}
#dock{margin-left:auto;display:flex;gap:.5em;align-items:flex-end}
.dk{background:rgba(32,32,48,.92);border:.18em solid var(--edge);border-radius:.35em;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:.2em;padding:.35em .5em;min-width:4.2em}
.dk:hover{border-color:var(--gold)}
.dk canvas{width:2.2em;height:2.2em;image-rendering:pixelated}
.dk span{font-size:.55em}
#hint{position:absolute;left:50%;bottom:.8em;transform:translateX(-50%);background:rgba(18,18,30,.9);
  border:.14em solid var(--edge-lo);padding:.3em .8em;font-size:.7em;pointer-events:none;z-index:5;white-space:nowrap}
#hint kbd{font-family:var(--px8);font-size:.8em;color:var(--gold)}
#toast{position:absolute;top:7em;left:50%;transform:translateX(-50%);z-index:12;display:flex;flex-direction:column;
  align-items:center;gap:.4em;pointer-events:none}
#toast div{background:rgba(18,18,30,.94);border:.16em solid var(--gold);padding:.35em .9em;font-size:.8em;
  animation:pop 2.6s forwards;white-space:nowrap}
@keyframes pop{0%{opacity:0;transform:translateY(.6em)}10%,80%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-.4em)}}

/* Title */
#title{position:absolute;inset:0;z-index:15;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(8,6,16,.72);text-align:center;gap:1.1em;padding:1em}
#title h1{font-family:var(--px8);font-weight:400;font-size:2.4em;margin:0;color:var(--gold);letter-spacing:.06em;
  text-shadow:.12em .12em 0 #7a2f3f,.24em .24em 0 #000}
#title p{margin:0;font-size:.9em;color:var(--txt);max-width:34em;line-height:1.6}
#title .keys{font-size:.7em;color:var(--dim)}
#start{font-size:1em;padding:.6em 1.6em;cursor:pointer;animation:bob 1.4s ease-in-out infinite}
#start:hover{background:var(--panel-hi);color:var(--gold)}
@keyframes bob{50%{transform:translateY(-.25em)}}

/* Sheet */
#sheet{position:absolute;inset:7% 12%;z-index:18;display:flex;flex-direction:column;padding:.9em 1.1em;gap:.7em;overflow:hidden}
#sheet header{display:flex;justify-content:space-between;align-items:center}
#sheet h2{margin:0;font-size:1.05em;font-weight:400;color:var(--gold)}
#sheet .x{background:#232334;border:.14em solid var(--edge-lo);cursor:pointer;padding:.2em .7em;font-size:.8em}
#sheet .x:hover{border-color:var(--sel)}
#sheet .body{overflow:auto;font-size:.78em;line-height:1.55;min-height:0;flex:1}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:.5em}
.slot{background:#1c1c2a;border:.14em solid var(--edge-lo);aspect-ratio:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:.3em;cursor:pointer;position:relative;padding:0}
.slot.sel{border-color:var(--gold)}
.slot img{width:3em;height:3em;image-rendering:pixelated}
.slot b{position:absolute;right:.3em;bottom:.15em;font-weight:400;font-size:.8em}
.slot.empty{opacity:.35;cursor:default}
.desc{margin-top:.8em;padding:.6em .8em;background:#1c1c2a;border:.14em solid var(--edge-lo);min-height:4.5em}
.desc button{margin-top:.5em;background:#2e2e44;border:.14em solid var(--sel);color:var(--sel);cursor:pointer;padding:.3em .9em;font-size:.95em}
.jl h3{margin:.9em 0 .3em;font-size:.95em;font-weight:400;color:var(--rose)}
.jl h3:first-child{margin-top:0}
.jl .en{display:grid;grid-template-columns:1fr;gap:.35em}
.jl .e{padding:.4em .6em;background:#1c1c2a;border-left:.25em solid var(--gold)}
.jl .e.no{border-left-color:var(--edge-lo);color:var(--dim)}
.jl .e b{font-weight:400;color:var(--gold)}
.set{display:flex;flex-direction:column;gap:.6em}
.set button{background:#232334;border:.14em solid var(--edge-lo);cursor:pointer;padding:.55em .9em;text-align:left;font-size:1em}
.set button:hover{border-color:var(--sel)}
.set .danger{color:var(--rose)}

@container (max-width:760px){
  #game{font-size:15px}
  .view{aspect-ratio:auto;background:none;box-shadow:none;overflow:visible;display:flex;flex-direction:column;gap:.6em}
  .stage{position:relative;aspect-ratio:16/9;order:2;border-radius:.4em;overflow:hidden;box-shadow:0 0 0 .2em #2a2840}
  #hud{position:static;order:1;flex-wrap:wrap;padding:0}
  #bottom{position:static;order:3;flex-wrap:wrap;padding:0}
  #dlg{flex:1 1 100%;max-width:none}
  #menu{flex:1 1 100%}
  #dock{margin-left:0;width:100%;justify-content:flex-end}
  #hub{position:static;display:grid;grid-template-columns:1fr;gap:.5em;padding:0}
  .pan{aspect-ratio:16/6}
  .pan canvas{height:100%}
  .inhub .stage{display:none}
  #toast{top:5em}
  #sheet{inset:.5em}
  .grid{grid-template-columns:repeat(4,1fr)}
  #strip{gap:.8em}
  .card{min-width:0}
}
@media (prefers-reduced-motion:reduce){#start,#more{animation:none}#fade{transition:none}}
</style>

<div id="wrap">
<div id="game" tabindex="0" aria-label="Aileen 的像素世界">
  <div class="view" id="view">
    <div id="hud">
      <div class="card pnl">
        <canvas id="pcard" width="22" height="22" aria-hidden="true"></canvas>
        <div>
          <div class="nm">Aileen</div>
          <div class="lv">Lv. <span id="lv">1</span></div>
          <div class="hearts" id="hearts"></div>
          <div class="xp" title="经验"><i id="xpb"></i></div>
        </div>
      </div>
      <div id="strip" role="navigation" aria-label="地点"></div>
      <button id="explore" class="pnl"><b>✦</b> 探索世界!</button>
    </div>

    <div class="stage">
      <canvas id="cv" width="480" height="270" aria-label="游戏画面"></canvas>
      <div id="hint" hidden></div>
      <div id="toast" aria-live="polite"></div>
      <div id="fade"></div>
    </div>

    <div id="hub" hidden></div>

    <div id="bottom">
      <div id="dlg" class="pnl" hidden>
        <canvas id="por" width="24" height="17"></canvas>
        <div class="bar"></div>
        <div style="flex:1;min-width:0"><div id="who"></div><div id="tx"></div></div>
        <div id="more">▼</div>
      </div>
      <div id="menu" class="pnl" hidden></div>
      <div id="dock">
        <button class="dk" data-k="inv" aria-label="背包"><canvas width="10" height="10"></canvas><span>背包</span></button>
        <button class="dk" data-k="jou" aria-label="日志"><canvas width="10" height="10"></canvas><span>日志</span></button>
        <button class="dk" data-k="set" aria-label="设置"><canvas width="10" height="10"></canvas><span>设置</span></button>
      </div>
    </div>

    <div id="title">
      <h1>AILEEN</h1>
      <p>地下乐队的鼓点、芝加哥大学的石头塔楼、北京落日里的蓝瓦。<br>带着背包的 Aileen，今天想去哪儿？</p>
      <button id="start" class="pnl">▶ 开始冒险</button>
      <div class="keys">方向键 / WASD 移动 · 空格 / E 互动 · 也可以直接点击地面和人物</div>
    </div>
  </div>
  <div id="sheet" class="pnl" hidden></div>
</div>
</div>
<script>
'use strict';
/* ============================================================
   Aileen 的像素世界 — 480x270 pixel canvas, drawn procedurally
   ============================================================ */
const W=480,H=270;
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>[...(r||document).querySelectorAll(s)];
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.imageSmoothingEnabled=false;return [c,x]};
const R=(g,c,x,y,w,h)=>{g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))};
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hx=c=>[1,3,5].map(i=>parseInt(c.slice(i,i+2),16));
const mixc=(a,b,t)=>{const A=hx(a),B=hx(b);return'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')'};
function ell(g,c,cx,cy,rx,ry){g.fillStyle=c;for(let y=-ry;y<=ry;y++){const w=Math.round(rx*Math.sqrt(Math.max(0,1-(y*y)/(ry*ry+.01))));g.fillRect(Math.round(cx-w),Math.round(cy+y),w*2+1,1)}}
function vgrad(g,x,y,w,h,stops,band){band=band||4;const n=Math.ceil(h/band);
  const colAt=t=>{for(let i=1;i<stops.length;i++){if(t<=stops[i][0]){const a=stops[i-1],b=stops[i];return mixc(a[1],b[1],(t-a[0])/(b[0]-a[0]||1))}}return mixc(stops[stops.length-1][1],stops[stops.length-1][1],0)};
  for(let i=0;i<n;i++){const t=i/(n-1||1);const hh=Math.min(band,h-i*band);R(g,colAt(t),x,y+i*band,w,hh);
    if(i<n-1&&hh===band){g.fillStyle=colAt((i+1)/(n-1));const yb=y+i*band+band-1;for(let xx=0;xx<w;xx+=2){g.fillRect(x+xx,yb,1,1);g.fillRect(x+xx+1,yb-1,1,1)}}}}
function trap(g,c,cx,y0,hw0,y1,hw1){for(let y=y0;y<=y1;y++){const t=(y-y0)/((y1-y0)||1);const hw=Math.round(lerp(hw0,hw1,t));R(g,c,cx-hw,y,hw*2+1,1)}}
function arch(g,c,x,y,w,h){const hw=w/2;for(let i=0;i<h;i++){let ins=0;if(i<hw)ins=Math.round(hw-i);R(g,c,x+ins,y+i,w-2*ins,1)}}
function txt(g,s,x,y,col,size){g.font=(size||8)+"px 'Press Start 2P',monospace";g.textBaseline='top';g.fillStyle=col;g.fillText(s,Math.round(x),Math.round(y))}
function blob(g,cx,cy,r,cols){ell(g,cols[0],cx,cy,r,r);ell(g,cols[1],cx-1,cy-2,Math.max(1,r-2),Math.max(1,r-3));if(cols[2])ell(g,cols[2],cx-Math.round(r*.3),cy-Math.round(r*.4),Math.max(1,Math.round(r*.55)),Math.max(1,Math.round(r*.45)))}
function cloud(g,x,y,s){ell(g,'#cfe6f6',x,y+3*s,18*s,6*s);ell(g,'#fff',x,y,18*s,6*s);ell(g,'#fff',x-8*s,y-4*s,9*s,6*s);ell(g,'#fff',x+7*s,y-6*s,10*s,7*s)}

/* ---------- pixel icons (items, hearts, dock) ---------- */
function icon(map,pal){const h=map.length,w=Math.max(...map.map(r=>r.length));const [c,g]=mk(w,h);
  map.forEach((row,y)=>[...row].forEach((ch,x)=>{if(pal[ch]){g.fillStyle=pal[ch];g.fillRect(x,y,1,1)}}));return c}
const ICONS={
  sticker:{n:'乐队贴纸',d:'一张闪电图案的贴纸，边角已经有点翘了。',map:['.kkkkkk.','kmmmmwmk','kmmmwwmk','kmmwwwwk','kmmmmwwk','kmmmwwmk','kmmwmmmk','.kkkkkk.'],pal:{m:'#d94f8c',w:'#fff6d8',k:'#6a1b40'}},
  pick:{n:'吉他拨片',d:'阿K 偷偷塞给你的拨片，上面有磨出来的指印。',map:['.kkkkkk.','kohhoook','kohooook','kooooook','.koooook','..kooook','...kook.','....kk..'],pal:{o:'#f0a63a',h:'#ffe08a',k:'#7a4a10'}},
  goldpick:{n:'金色拨片',d:'合奏之后拿到的金色拨片。别弄丢了。',map:['.kkkkkk.','kohhoook','kohooook','kooooook','.koooook','..kooook','...kook.','....kk..'],pal:{o:'#ffd23f',h:'#fff6c0',k:'#8a6a10'}},
  ticket:{n:'演出票根',d:'地上捡到的全场站票票根，背面有人写了一个电话号码。',map:['kkkkkkkk','ktttttdk','ktddtttk','ktttttdk','ktddtttk','ktttttdk','kkkkkkkk'],pal:{t:'#efe2b0',d:'#c4553a',k:'#5a4a3a'}},
  coffee:{n:'一杯咖啡',d:'Evan 给的，已经续了四杯的那种。喝下去心情 +1。',use:'喝掉',map:['.s..s...','..s..s..','kkkkkkk.','kccccckk','kcbbbbck','.kcccck.','..kkkk..'],pal:{c:'#f2f2f2',b:'#6b3f23',k:'#3a3a4a',s:'#b8b8d0'}},
  acorn:{n:'橡果',d:'松鼠推到你脚边的橡果。很圆，很沉。',map:['...kk...','..kbbk..','.kbbbbk.','.kkkkkk.','.kcccck.','..kcck..','...kk...'],pal:{b:'#8a5a2b',c:'#c98f4a',k:'#3b2412'}},
  pennant:{n:'栗色旗帜',d:'芝加哥大学的栗色小旗，风一吹就像在鼓掌。',map:['pkkkkkk.','prrrrrrk','prrwwrrk','pprrrrk.','pp.rrk..','p...k...','p.......','p.......'],pal:{r:'#8b1e2d',w:'#fff',k:'#3a0d14',p:'#c9a14a'}},
  tanghulu:{n:'冰糖葫芦',d:'山楂酸，糖衣甜。慢慢吃，心情 +1。',use:'吃掉',map:['...ss...','..krrk..','..rhrr..','..krrk..','..rhrr..','..krrk..','...ss...','...ss...'],pal:{r:'#d8262f',h:'#ff8a8a',s:'#d9b36a',k:'#5a1015'}},
  lantern:{n:'小红灯笼',d:'北京的晚风里晃着的小灯笼，里面亮着一点点暖光。',map:['...kk...','..kggk..','.krrrrk.','krhrrrrk','krrrrrrk','.krrrrk.','..kggk..','...yy...'],pal:{r:'#e0372f',h:'#ff8a6a',g:'#ffd36a',k:'#6a1710',y:'#f7b733'}},
  brush:{n:'水写毛笔',d:'大爷借你的大号毛笔，蘸水就能在地砖上写字。',map:['......b.','.....bb.','....wb..','...ww...','..ww....','.ww.....','kk......','k.......'],pal:{w:'#d9c08c',b:'#33302c',k:'#33302c'}}
};
const ICON_URL={};
Object.keys(ICONS).forEach(k=>{ICON_URL[k]=icon(ICONS[k].map,ICONS[k].pal).toDataURL()});

function freeSpot(x,y){const sc=scene,w=sc.walk;x=clamp(x,w.x0,w.x1);y=clamp(y,w.y0,w.y1);if(!sc.blocked(x,y))return [x,y];

  for(const e of list){const h=hitDefault(e);if(px>=h[0]&&px<=h[0]+h[2]&&py>=h[1]&&py<=h[1]+h[3]){
      const d=Math.hypot(P.x-(e.ix??e.x),P.y-(e.iy??e.y));

function updatePlayer(dt){
  if(mode!=='walk'||!scene||sheetOpen){P.moving=false;return}
  let vx=0,vy=0;if(keys.l)vx--;if(keys.r)vx++;if(keys.u)vy--;if(keys.d)vy++;
  if(vx||vy){P.tx=null;P.after=null;const m=Math.hypot(vx,vy);vx/=m;vy/=m}
  else if(P.tx!=null){const dx=P.tx-P.x,dy=P.ty-P.y,d=Math.hypot(dx,dy);
    if(d<2.5){P.tx=null;const a=P.after;P.after=null;if(a)a()}else{vx=dx/d;vy=dy/d}}
  const sp=64,w=scene.walk,ox=P.x,oy=P.y;
  if(vx){const nx=clamp(P.x+vx*sp*dt,w.x0,w.x1);if(!scene.blocked(nx,P.y))P.x=nx}
  if(vy){const ny=clamp(P.y+vy*sp*dt,w.y0,w.y1);if(!scene.blocked(P.x,ny))P.y=ny}
  P.moving=Math.hypot(P.x-ox,P.y-oy)>.01;
  if(P.tx!=null&&!P.moving){P.stuck+=dt;if(P.stuck>.4){P.tx=null;const a=P.after;P.after=null;const n=nearest();if(a&&n)a()}}else P.stuck=0;

}

const RH={on:false,notes:[],score:0,combo:0,max:0,perfect:0,good:0,miss:0,pops:[],a0:null,p0:0,end:0,fin:false};
const LANEX=[180,240,300],HITY=210,TRAVEL=1.5;
function rnow(){return RH.a0!=null?Aud.ctx.currentTime-RH.a0:(performance.now()-RH.p0)/1000}

  const q=rng(7);RH.notes=[];let last=-1;
  for(let i=0;i<64;i++){if(i%2===0||i%8===7){let l=(q()*3)|0;if(l===last)l=(l+1+((q()*2)|0))%3;last=l;RH.notes.push({t:2+i*.25,lane:l,st:0})}}
  RH.score=0;RH.combo=0;RH.max=0;RH.perfect=0;RH.good=0;RH.miss=0;RH.pops=[];RH.fin=false;RH.end=RH.notes[RH.notes.length-1].t+1.2;

  RH.notes.forEach(n=>{if(n.st===0&&n.lane===l){const d=Math.abs(n.t-now);if(d<bd){bd=d;best=n}}});
  if(best){best.st=1;const pf=bd<.09;pf?RH.perfect++:RH.good++;RH.score+=pf?100:50;RH.combo++;RH.max=Math.max(RH.max,RH.combo);
    RH.pops.push({s:pf?'PERFECT':'GOOD',x:LANEX[l],t:now,c:pf?'#ffd86b':'#9ad8ff'});sfx.hit(l)}
  RH.flash=RH.flash||[];RH.flash[l]=now}

  RH.notes.forEach(n=>{if(n.st===0&&now-n.t>.22){n.st=2;RH.miss++;RH.combo=0;RH.pops.push({s:'MISS',x:LANEX[n.lane],t:now,c:'#ff6b8a'});sfx.miss()}});
  if(!RH.fin&&now>RH.end){RH.fin=true;finishRhythm()}}

  hub.innerHTML='';strip.innerHTML='';
  PLACES.forEach((p,i)=>{
    const b=document.createElement('button');b.className='pan';b.setAttribute('aria-label','前往'+p.name);
    b.innerHTML=`<canvas width="160" height="140"></canvas><div class="lab">${p.name}<small>${p.en}</small></div>`;b.onclick=()=>{if(mode==='hub'&&menuRes){menuSel=i;pickMenu(i)}};b.onmouseenter=()=>{if(mode==='hub'){menuSel=i;paintMenu()}};hub.appendChild(b);
    const s=document.createElement('button');s.className='isl';s.dataset.id=p.id;s.innerHTML=`<canvas width="56" height="36"></canvas><span>${p.name}</span>`;
    const c=s.querySelector('canvas'),x=c.getContext('2d');x.imageSmoothingEnabled=false;x.drawImage(SC[p.id].full,p.crop[0],p.crop[1],p.crop[2],p.crop[3],0,0,56,36);
    s.onclick=()=>{if(mode==='walk'||mode==='hub'){if(scene&&scene.id===p.id&&mode==='walk')return;if(mode==='hub'&&menuRes){menuSel=i;pickMenu(i)}else goTo(p.id)}};strip.appendChild(s)});
  hubReady=true}
function markStrip(){$$('.isl').forEach(s=>s.setAttribute('aria-current',scene&&mode!=='hub'&&s.dataset.id===scene.id?'true':'false'))}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function enterHub(first){
  if(busy)return;busy=true;fade.classList.add('on');await sleep(first?0:350);
  scene=null;mode='hub';hub.hidden=false;view.classList.add('inhub');dlg.hidden=true;menu.hidden=true;hint.hidden=true;markStrip();
  playSong('hub');fade.classList.remove('on');busy=false;
  if(!first)hubPrompt()}
async function hubPrompt(){
  showDlg('A','又是新的一天，新的地方……今天去哪儿呢？');$('#more').style.visibility='visible';
  const i=await choose(PLACES.map(p=>[p.name,p.en]));mode='hub';goTo(PLACES[i].id)}
async function goTo(id){
  if(busy)return;busy=true;fade.classList.add('on');await sleep(350);
  scene=SC[id];P.x=scene.spawn[0];P.y=scene.spawn[1];P.dir=1;P.tx=null;P.after=null;
  hub.hidden=true;view.classList.remove('inhub');dlg.hidden=true;menu.hidden=true;mode='walk';markStrip();
  playSong({venue:'venue',uchi:'uchi',bj:'bj'}[id]);fade.classList.remove('on');await sleep(250);busy=false;
  if(!S.visited[id]){S.visited[id]=1;save();await scene.first();
    if(PLACES.every(p=>S.visited[p.id])&&!S.done.all){S.done.all=1;save();await sleep(200);toast('★ 三地打卡完成');sfx.lvl();
      await say(['A','地下室的鼓点，石头塔楼的钟声，落日里的蓝瓦。'],['A','今天的 Aileen，没有白过。'],['s','（世界还很大。想再逛逛的话，随时可以出发。）']);gain(30)}}}

/* ---------- sheets ---------- */
let sheetOpen=false,selItem=null;
function openSheet(kind){if(sheetOpen){closeSheet();return}if(mode==='talk'||mode==='menu'||mode==='rhythm'||busy)return;sheetOpen=true;P.tx=null;keys.l=keys.r=keys.u=keys.d=false;
  sheet.hidden=false;if(kind==='inv')renderInv();else if(kind==='jou')renderJou();else renderSet()}
function closeSheet(){sheetOpen=false;sheet.hidden=true}
function sheetFrame(title,body){sheet.innerHTML=`<header><h2>${title}</h2><button class="x" id="sx">关闭 ✕</button></header><div class="body">${body}</div>`;$('#sx').onclick=closeSheet}
function renderInv(){
  const all=Object.keys(ICONS);const ids=[...all.filter(k=>S.items[k]),...all.filter(k=>!S.items[k])];const slots=ids.map(id=>{const n=S.items[id]||0;return n?`<button class="slot${selItem===id?' sel':''}" data-id="${id}"><img alt="${ICONS[id].n}" src="${ICON_URL[id]}">${n>1?`<b>${n}</b>`:''}</button>`:`<div class="slot empty"></div>`}).join('');
  const it=selItem&&S.items[selItem]?ICONS[selItem]:null;
  sheetFrame('背包',`<div class="grid">${slots}</div><div class="desc">${it?`<b style="color:var(--gold);font-weight:400">${it.n}</b><br>${it.d}${it.use?`<br><button id="useb">${it.use}</button>`:''}`:(Object.keys(S.items).some(k=>S.items[k])?'选一件物品看看。':'背包是空的。去各个地方走走，会遇到值得带走的东西。')}</div>`);
  $$('.slot[data-id]').forEach(b=>b.onclick=()=>{selItem=b.dataset.id;renderInv()});
  const ub=$('#useb');if(ub)ub.onclick=()=>{if(S.hearts>=3){toast('心情已经满格了');return}S.items[selItem]--;setHearts(S.hearts+1);sfx.get();toast('心情 +1');save();renderInv()}}
function renderJou(){
  const groups={v:'地下乐队',u:'芝加哥大学',b:'北京'};const found=Object.keys(S.journal).filter(k=>J[k]).length;
  let h=`<div style="color:var(--dim);margin-bottom:.6em">已记录 ${found} / ${JN}${S.done.all?'　★ 三地打卡':''}</div><div class="jl">`;
  Object.keys(groups).forEach(k=>{h+=`<h3>${groups[k]}</h3><div class="en">`;Object.keys(J).filter(id=>J[id][0]===k).forEach(id=>{h+=S.journal[id]?`<div class="e"><b>${J[id][1]}</b><br>${J[id][2]}</div>`:`<div class="e no">？？？</div>`});h+='</div>'});
  sheetFrame('日志',h+'</div>')}
function renderSet(){
  sheetFrame('设置',`<div class="set"><button id="s1">音乐：${S.music?'开':'关'}</button><button id="s2">音效：${S.sfx?'开':'关'}</button><button id="s3">CRT 扫描线：${S.crt?'开':'关'}</button><button id="s4" class="danger">重新开始（清除存档）</button><div style="color:var(--dim);font-size:.9em;margin-top:.4em">方向键 / WASD 移动 · 空格 / E 互动 · Esc 关闭窗口</div></div>`);
  $('#s1').onclick=()=>{audInit();setMusic(!S.music);if(S.music&&Aud.want)playSong(Aud.want,true);renderSet()};
  $('#s2').onclick=()=>{S.sfx=!S.sfx;save();renderSet()};
  $('#s3').onclick=()=>{S.crt=!S.crt;view.classList.toggle('crt',S.crt);save();renderSet()};
  let armed=false;$('#s4').onclick=function(){if(!armed){armed=true;this.textContent='再点一次确认：所有进度都会消失';return}
    try{localStorage.removeItem(KEY)}catch(e){}S={lvl:1,xp:0,hearts:2,items:{},journal:{},visited:{},done:{},music:S.music,sfx:S.sfx,crt:S.crt};save();renderHud();closeSheet();Object.keys(SC).forEach(k=>SC[k].ents.forEach(e=>{}));enterHub()}}

/* ---------- input ---------- */
function act(){
  if(sheetOpen)return;
  if(mode==='talk')return advance();
  if(mode==='walk'){const n=nearest();if(n){P.tx=null;face(n);n.use()}}
  if(mode==='menu'||mode==='hub'){if(menuRes)pickMenu(menuSel)}}
const KM={ArrowLeft:'l',a:'l',A:'l',ArrowRight:'r',d:'r',D:'r',ArrowUp:'u',w:'u',W:'u',ArrowDown:'d',s:'d',S:'d'};
addEventListener('keydown',e=>{
  if(e.target&&/INPUT|TEXTAREA/.test(e.target.tagName))return;
  if(mode==='rhythm'){const l={ArrowLeft:0,a:0,A:0,ArrowDown:1,s:1,S:1,ArrowRight:2,d:2,D:2}[e.key];if(l!=null){e.preventDefault();rhythmPress(l)}if(e.key==='Escape'){RH.on=false;RH.fin=true;mode='walk';playSong('venue')}return}
  if(e.key==='Escape'){if(sheetOpen)closeSheet();return}
  if(e.key===' '||e.key==='Enter'||e.key==='e'||e.key==='E'){
    if(sheetOpen)return;
    if(document.activeElement&&document.activeElement.tagName==='BUTTON'&&e.key==='Enter'&&mode!=='talk')return;
    e.preventDefault();act();return}
  if(mode==='menu'||mode==='hub'){if(e.key==='ArrowUp'||e.key==='w'){menuSel=(menuSel+menuOpts.length-1)%menuOpts.length;paintMenu();e.preventDefault()}
    else if(e.key==='ArrowDown'||e.key==='s'){menuSel=(menuSel+1)%menuOpts.length;paintMenu();e.preventDefault()}
    else if(e.key>='1'&&e.key<='9'&&+e.key<=menuOpts.length){pickMenu(+e.key-1)}return}
  const k=KM[e.key];if(k){keys[k]=true;if(mode==='walk')e.preventDefault()}});
addEventListener('keyup',e=>{const k=KM[e.key];if(k)keys[k]=false});
addEventListener('blur',()=>{keys.l=keys.r=keys.u=keys.d=false});
cv.addEventListener('pointerdown',e=>{
  const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
  if(mode==='rhythm'){rhythmPress(x<210?0:x<270?1:2);return}
  if(mode==='talk'){advance();return}
  if(mode==='walk'&&!sheetOpen)clickAt(x,y)});
dlg.addEventListener('pointerdown',()=>{if(mode==='talk')advance()});
$$('.dk').forEach(b=>b.addEventListener('click',()=>{audInit();openSheet(b.dataset.k)}));
$('#explore').addEventListener('click',()=>{if(sheetOpen)closeSheet();if(mode==='walk'&&!busy){P.tx=null;enterHub()}});
$('#start').addEventListener('click',()=>{audInit();$('#title').hidden=true;playSong('hub');hubPrompt()});

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
  tickTyper(dt);updatePlayer(dt);rhythmTick();
  if(scene)scene.ents.forEach(e=>e.update&&e.update(dt,T));
  render();if(mode==='hub'||mode==='title')hubDraw();
  requestAnimationFrame(frame)}
async function boot(){
  try{await Promise.race([Promise.all([document.fonts.load("8px 'Press Start 2P'"),document.fonts.load("700 18px 'Noto Sans SC'")]),sleep(1500)])}catch(e){}
  buildVenueEnv();
}
function buildVenueEnv(){
  const sv=buildVenue,su=buildUChi,sb=buildBeijing;
  makeScenes();buildHubUI();renderHud();view.classList.toggle('crt',!!S.crt);
  mode='hub';hub.hidden=false;view.classList.add('inhub');markStrip();
  window.__game={goTo,enterHub,SC,P,say,get mode(){return mode},get scene(){return scene},S,startRhythm,rhythmPress,RH,gain,openSheet};
  requestAnimationFrame(frame)}
boot();
</script>
